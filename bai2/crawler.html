
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crawler - THE DAILY</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<header class="container brand-row">
    <a class="brand" href="index.html">
        <span class="logo-mark">
            D<span class="logo-dot">.</span>
        </span>
        <span>
            <h1>THE DAILY</h1>
            <small>Crawler bài viết</small>
        </span>
    </a>

    <div class="header-actions">
        <a class="btn secondary" href="index.html">
            ← Về trang chủ
        </a>
    </div>
</header>

<div class="nav-wrap">
    <div class="container">
        <button id="menuToggle" class="menu-toggle">☰</button>
        <nav id="mainNav" class="nav"></nav>
    </div>
</div>

<main class="container">

    <div class="breadcrumb">
        <a href="index.html">Trang chủ</a> / Crawler
    </div>

    <h2 class="section-title">Crawler bài viết từ URL</h2>

    <!-- Quản lý dữ liệu bài viết -->
    <section class="form-card">
        <h3>Quản lý dữ liệu bài viết</h3>

        <p>
            Website tự động nạp bài viết có sẵn.
            Bạn cũng có thể nhập thêm dữ liệu từ file JSON.
        </p>

        <div class="field">
            <label for="jsonFile">Chọn file posts.json</label>
            <input
                type="file"
                id="jsonFile"
                accept=".json,application/json"
            >
        </div>

        <button class="btn" type="button" id="importBtn">
            Nhập bài viết vào LocalStorage
        </button>

        <button class="btn secondary" type="button" id="exportBtn">
            Xuất dữ liệu JSON
        </button>

        <div id="importStatus" class="status"></div>
    </section>

    <!-- Khu vực Crawler -->
    <div class="crawler-grid">

        <section class="form-card">

            <form id="crawlerForm">

                <div class="field">
                    <label for="url">
                        URL bài viết tin tức
                    </label>

                    <input
                        id="url"
                        type="url"
                        required
                        placeholder="https://example.com/tin-tuc/bai-viet.html"
                    >
                </div>

                <button class="btn" type="submit">
                    Crawl dữ liệu
                </button>

                <button
                    class="btn secondary"
                    id="saveBtn"
                    type="button"
                >
                    Lưu vào LocalStorage
                </button>

                <button
                    class="btn secondary"
                    id="resetBtn"
                    type="button"
                >
                    Xóa dữ liệu đã lưu
                </button>

            </form>

            <div id="status" class="status"></div>

        </section>

        <!-- Hiển thị JSON chuẩn hóa -->
        <section class="form-card">
            <h3 style="margin-top:0">
                JSON chuẩn hóa
            </h3>

            <pre id="preview" class="json-preview">Sau khi crawl, JSON sẽ hiển thị tại đây.</pre>
        </section>

    </div>

</main>

<footer id="siteFooter"></footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js?v=6"></script>
<script src="assets/js/crawler.js?v=5"></script>

</body>
</html>
